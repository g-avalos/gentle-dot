# Builds the Windows NSIS installer and uploads it as an artifact, following
# docs/install.md "Build the installer from source". Run it manually or push a `test/**` branch.
name: Windows installer

on:
  push:
    branches: ['test/**']
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: pnpm install --frozen-lockfile

      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Build app-channel addon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p process.version
          $inputs = Join-Path $env:RUNNER_TEMP 'node-addon-inputs'
          New-Item -ItemType Directory -Force -Path $inputs | Out-Null
          $release = "https://nodejs.org/download/release/$version"
          Invoke-WebRequest "$release/node-$version-headers.tar.gz" -OutFile "$inputs/headers.tar.gz"
          Invoke-WebRequest "$release/win-x64/node.lib" -OutFile "$inputs/node.lib"
          $sums = (Invoke-WebRequest "$release/SHASUMS256.txt").Content -split "`n"
          foreach ($pair in @(@("node-$version-headers.tar.gz", 'headers.tar.gz'), @('win-x64/node.lib', 'node.lib'))) {
            $line = $sums | Where-Object { $_ -match "^[0-9a-f]{64}\s+$([regex]::Escape($pair[0]))$" }
            if (-not $line) { throw "No published checksum for $($pair[0])" }
            $actual = (Get-FileHash -Algorithm SHA256 (Join-Path $inputs $pair[1])).Hash.ToLowerInvariant()
            if ($actual -ne ($line -split '\s+')[0]) { throw "Checksum mismatch for $($pair[0])" }
          }
          tar -xf "$inputs/headers.tar.gz" -C $inputs
          if ($LASTEXITCODE -ne 0) { throw 'Node header extraction failed' }
          $compiler = (Get-Command cl.exe).Source
          pnpm --filter @gentle-dot/daemon run build:windows-stop -- --compiler "$compiler" --headers "$inputs/node-$version/include/node" --node-lib "$inputs/node.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Native addon build failed' }

      - name: Stage runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Must be the real go.exe in GOROOT\bin, not a shim.
          $env:GENTLE_DOT_BUILD_GO = Join-Path (go env GOROOT) 'bin\go.exe'
          pnpm package:runtime --target windows-x64
          if ($LASTEXITCODE -ne 0) { throw 'Runtime staging failed' }

      - name: Build installer
        shell: pwsh
        run: |
          pnpm package:windows
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: gentle-dot-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
